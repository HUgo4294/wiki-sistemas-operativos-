<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador del Algoritmo del Banquero</title>
<style>
  :root {
    --bg: #ffffff; --card: #f4f5f8; --text: #1b1d24; --muted: #5b6070;
    --border: #d3d6df; --accent: #5c2d91; --ok: #16a34a; --bad: #dc2626; --warn: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c; --card: #22242b; --text: #e8e9ee; --muted: #a0a4b3;
      --border: #3a3d49; --accent: #a78bfa; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; }
  h2 { margin: 0 0 4px; font-size: 18px; }
  p.sub { margin: 0 0 12px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  textarea, input { width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px;
    background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px; }
  textarea { height: 120px; resize: vertical; }
  .row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 120px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 14px;
           font-weight: 600; cursor: pointer; }
  button.sec { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  table { border-collapse: collapse; width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  th, td { border: 1px solid var(--border); padding: 4px 8px; text-align: center; }
  th { background: var(--bg); }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 99px; font-weight: 700; color: #fff; }
  .ok { background: var(--ok); } .bad { background: var(--bad); } .warn { background: var(--warn); }
  .scroll { overflow-x: auto; }
  ol { margin: 6px 0 0 18px; padding: 0; }
</style>
</head>
<body>
<h2>Simulador del Algoritmo del Banquero</h2>
<p class="sub">Un proceso por línea, valores separados por espacios. Need = Max − Allocation.</p>

<div class="grid">
  <div class="card"><label for="avail">Available (m valores)</label>
    <textarea id="avail" style="height:44px"></textarea></div>
  <div class="card"><label for="alloc">Allocation (n × m)</label>
    <textarea id="alloc"></textarea></div>
  <div class="card"><label for="max">Max (n × m)</label>
    <textarea id="max"></textarea></div>
</div>

<div class="row" style="margin-bottom:10px">
  <button id="btnCalc">Calcular estado</button>
  <button id="btnReset" class="sec">Restaurar ejemplo</button>
</div>

<div class="card" id="outState" style="display:none"></div>

<div class="card">
  <label>Evaluar una solicitud</label>
  <div class="row">
    <div><label for="pid" style="font-weight:400">Proceso (índice, desde 0)</label>
      <input id="pid" type="number" min="0" value="1"></div>
    <div><label for="req" style="font-weight:400">Request (ej. 1 0 2)</label>
      <input id="req" value="1 0 2"></div>
    <div style="flex:0"><button id="btnReq">Solicitar</button></div>
  </div>
  <div id="outReq" style="margin-top:10px"></div>
</div>

<script>
(function () {
  var DEFAULT = {
    avail: "3 3 2",
    alloc: "0 1 0\n2 0 0\n3 0 2\n2 1 1\n0 0 2",
    max:   "7 5 3\n3 2 2\n9 0 2\n2 2 2\n4 3 3"
  };
  var $ = function (id) { return document.getElementById(id); };

  function parseMatrix(text) {
    return text.trim().split(/\n+/).filter(Boolean).map(function (l) {
      return l.trim().split(/\s+/).map(Number);
    });
  }
  function parseVector(text) { return text.trim().split(/\s+/).map(Number); }
  function bad(m) { return m.some(function (r) { return r.some(function (x) { return isNaN(x) || x < 0; }); }); }

  function readState() {
    var available = parseVector($("avail").value);
    var allocation = parseMatrix($("alloc").value);
    var max = parseMatrix($("max").value);
    var n = allocation.length, m = available.length;
    if (!n || !m || bad(allocation) || bad(max) || bad([available])) throw new Error("Hay valores no numéricos o negativos.");
    if (max.length !== n) throw new Error("Max y Allocation deben tener el mismo número de procesos.");
    for (var i = 0; i < n; i++) {
      if (allocation[i].length !== m || max[i].length !== m)
        throw new Error("La fila " + i + " debe tener " + m + " valores.");
    }
    var need = max.map(function (row, i) { return row.map(function (v, j) { return v - allocation[i][j]; }); });
    for (var a = 0; a < n; a++) for (var b = 0; b < m; b++)
      if (need[a][b] < 0) throw new Error("Allocation de P" + a + " supera su Max en la columna " + b + ".");
    return { available: available, allocation: allocation, max: max, need: need, n: n, m: m };
  }

  function leq(a, b) { return a.every(function (x, j) { return x <= b[j]; }); }

  function safety(s) {
    var work = s.available.slice(), finish = s.allocation.map(function () { return false; });
    var seq = [], steps = [], progress = true;
    while (progress) {
      progress = false;
      for (var i = 0; i < s.n; i++) {
        if (!finish[i] && leq(s.need[i], work)) {
          var before = work.slice();
          work = work.map(function (w, j) { return w + s.allocation[i][j]; });
          finish[i] = true; seq.push(i); progress = true;
          steps.push("P" + i + ": Need (" + s.need[i].join(", ") + ") ≤ (" + before.join(", ") +
                     ") → Work = (" + work.join(", ") + ")");
        }
      }
    }
    return { safe: finish.every(Boolean), seq: seq, steps: steps, stuck: finish.map(function (f, i) { return f ? -1 : i; }).filter(function (i) { return i >= 0; }) };
  }

  function table(s) {
    var h = "<div class='scroll'><table><tr><th>Proceso</th><th>Allocation</th><th>Max</th><th>Need</th></tr>";
    for (var i = 0; i < s.n; i++)
      h += "<tr><td>P" + i + "</td><td>" + s.allocation[i].join(" ") + "</td><td>" + s.max[i].join(" ") +
           "</td><td>" + s.need[i].join(" ") + "</td></tr>";
    return h + "</table></div>";
  }

  function esc(t) { return String(t).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }

  function showState(s, r) {
    var h = "<b>Estado: </b>" + (r.safe ? "<span class='tag ok'>SEGURO</span>" : "<span class='tag bad'>INSEGURO</span>") + "<br><br>" + table(s);
    if (r.safe) {
      h += "<p><b>Secuencia segura:</b> &lt;" + r.seq.map(function (i) { return "P" + i; }).join(", ") + "&gt;</p>";
    } else {
      h += "<p><b>Procesos que no pueden terminar:</b> " + r.stuck.map(function (i) { return "P" + i; }).join(", ") + "</p>";
    }
    h += "<b>Traza (Work inicial = (" + s.available.join(", ") + ")):</b><ol>" +
         r.steps.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ol>";
    $("outState").innerHTML = h; $("outState").style.display = "block";
  }

  function fail(target, msg) { $(target).innerHTML = "<span class='tag bad'>Error</span> " + esc(msg); if (target === "outState") $(target).style.display = "block"; }

  $("btnCalc").onclick = function () {
    try { var s = readState(); showState(s, safety(s)); } catch (e) { fail("outState", e.message); }
  };

  $("btnReq").onclick = function () {
    try {
      var s = readState();
      var i = parseInt($("pid").value, 10), r = parseVector($("req").value);
      if (isNaN(i) || i < 0 || i >= s.n) throw new Error("Índice de proceso inválido.");
      if (r.length !== s.m || r.some(function (x) { return isNaN(x) || x < 0; })) throw new Error("El request debe tener " + s.m + " valores no negativos.");
      var out = "";
      if (!leq(r, s.need[i])) {
        out = "<span class='tag bad'>ERROR</span> El proceso excede su máximo declarado: Request (" + r.join(", ") + ") &gt; Need (" + s.need[i].join(", ") + ").";
      } else if (!leq(r, s.available)) {
        out = "<span class='tag warn'>ESPERA</span> No hay recursos suficientes: Request (" + r.join(", ") + ") &gt; Available (" + s.available.join(", ") + ").";
      } else {
        var t = { n: s.n, m: s.m, max: s.max,
          available: s.available.map(function (v, j) { return v - r[j]; }),
          allocation: s.allocation.map(function (row, k) { return k === i ? row.map(function (v, j) { return v + r[j]; }) : row.slice(); }),
          need: s.need.map(function (row, k) { return k === i ? row.map(function (v, j) { return v - r[j]; }) : row.slice(); }) };
        var res = safety(t);
        out = res.safe
          ? "<span class='tag ok'>CONCEDIDA</span> El estado resultante es seguro. Secuencia: &lt;" + res.seq.map(function (k) { return "P" + k; }).join(", ") + "&gt;. Available quedaría en (" + t.available.join(", ") + ")."
          : "<span class='tag bad'>RECHAZADA</span> Conceder la solicitud llevaría a un estado inseguro (Available quedaría en (" + t.available.join(", ") + ")). P" + i + " debe esperar.";
      }
      $("outReq").innerHTML = out;
    } catch (e) { fail("outReq", e.message); }
  };

  function load() { $("avail").value = DEFAULT.avail; $("alloc").value = DEFAULT.alloc; $("max").value = DEFAULT.max; }
  $("btnReset").onclick = function () { load(); $("outState").style.display = "none"; $("outReq").innerHTML = ""; $("pid").value = 1; $("req").value = "1 0 2"; };
  load(); $("btnCalc").click();
})();
</script>
</body>
</html>
